name: CI

on:
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        # Disable npm cache to avoid authentication issues
        # cache: 'npm'

    - name: Install dependencies
      run: |
        rm -f .npmrc
        rm -f package-lock.json
        npm config set registry https://registry.npmjs.org/
        npm config delete //registry.npmjs.org/:_authToken || true
        npm whoami || echo "Not logged in to npm (this is expected)"
        npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

    # The packages import each other through their built output, so they are built in dependency order.
    - name: Build packages
      run: |
        npm run build:core
        npm run build:a11y
        npm run build:ui-common
        npm run build:ui-dialog
        npm run build:ui-input
        npm run build:ui-file

    - name: Lint
      run: npm run lint

    - name: Test main app
      run: npm run test

    # ddata-ui is not tested yet: it still imports files of the consuming application
    # and private FontAwesome Pro packages that are not available in CI.
    - name: Test ddata-core
      run: npx ng test ddata-core --no-watch

    - name: Test ddata-ui-input
      run: npx ng test ddata-ui-input --no-watch

    - name: Test ddata-ui-file
      run: npx ng test ddata-ui-file --no-watch

    - name: Test ddata-ui-dialog
      run: npx ng test ddata-ui-dialog --no-watch

    - name: Test ddata-ui-common
      run: npx ng test ddata-ui-common --no-watch

    - name: Test ddata-a11y
      run: npx ng test ddata-a11y --no-watch
