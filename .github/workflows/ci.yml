name: CI

on:
  pull_request:
    branches: [ master, main ]

jobs:
  # A separate job, so the build shows up as its own check on the pull request.
  # It uses the same production configuration and dependency order as the publish workflow.
  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        # Disable npm cache to avoid authentication issues
        # cache: 'npm'

    - name: Install dependencies
      run: |
        rm -f .npmrc
        rm -f package-lock.json
        npm config set registry https://registry.npmjs.org/
        npm config delete //registry.npmjs.org/:_authToken || true
        npm whoami || echo "Not logged in to npm (this is expected)"
        npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

    # The packages import each other through their built output, so they are built in dependency order.
    - name: Build packages
      run: |
        npm run build:core
        npm run build:a11y
        npm run build:ui-common
        npm run build:ui-dialog
        npm run build:ui-input
        npm run build:ui-file
        npm run build:ui-views
        npm run build:ui

    # Installs the packed packages into a scratch project and imports them, like a consumer would.
    - name: Verify consumer installation
      run: npm run verify:consumer

    # Lint and the tests resolve the packages from dist/ (see the paths in tsconfig.json), so they reuse this build.
    - name: Upload built packages
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error
        retention-days: 1

  test-and-lint:
    name: Lint and test
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        # Disable npm cache to avoid authentication issues
        # cache: 'npm'

    - name: Install dependencies
      run: |
        rm -f .npmrc
        rm -f package-lock.json
        npm config set registry https://registry.npmjs.org/
        npm config delete //registry.npmjs.org/:_authToken || true
        npm whoami || echo "Not logged in to npm (this is expected)"
        npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

    - name: Download built packages
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Lint
      run: npm run lint

    - name: Test main app
      run: npm run test

    # The package tests run with coverage; the thresholds in angular.json fail the step when coverage drops below them.
    - name: Test ddata-core
      run: npx ng test ddata-core --no-watch --coverage

    - name: Test ddata-ui-input
      run: npx ng test ddata-ui-input --no-watch --coverage

    - name: Test ddata-ui-file
      run: npx ng test ddata-ui-file --no-watch --coverage

    - name: Test ddata-ui-dialog
      run: npx ng test ddata-ui-dialog --no-watch --coverage

    - name: Test ddata-ui-common
      run: npx ng test ddata-ui-common --no-watch --coverage

    - name: Test ddata-a11y
      run: npx ng test ddata-a11y --no-watch --coverage

    - name: Test ddata-ui
      run: npx ng test ddata-ui --no-watch

    - name: Test ddata-ui-views
      run: npx ng test ddata-ui-views --no-watch --coverage

    # The coverage reports of every package (coverage/<package>/), also when a test step failed.
    - name: Upload coverage reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/
        if-no-files-found: warn
        retention-days: 14
