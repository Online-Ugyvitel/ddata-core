<span [class]="_class">
  <fa-icon *ngIf="showIcon" [icon]="icon.tag"></fa-icon>

  <span> {{ tag?.name }} </span>

  <button
    class="btn btn-xs dd-btn-neutral"
    type="button"
    [attr.aria-label]="deleteButtonText + ': ' + (tag?.name ?? '')"
    (click)="deleteTag()"
  >
    <fa-icon [icon]="icon.times"></fa-icon>
  </button>
</span>
