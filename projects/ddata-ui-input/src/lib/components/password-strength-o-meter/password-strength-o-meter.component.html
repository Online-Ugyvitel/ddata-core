@let value = progress;
@let text = levelText;
@let status = pwnedStatus;
<div class="progress">
  <div
    class="progress-bar"
    [class.bg-danger]="level === 'weak'"
    [class.bg-warning]="level === 'medium'"
    [class.bg-success]="level === 'strong'"
    [style.width.%]="value"
    role="progressbar"
    [attr.aria-label]="label"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="value"
    [attr.aria-valuetext]="label + ': ' + text"
    [attr.aria-busy]="status === 'checking' ? 'true' : null"
  ></div>
</div>
@if (showText) {
  <small class="password-strength-text text-muted" aria-hidden="true"
    >{{ label }}: {{ text }}</small
  >
}
@if (status === 'compromised') {
  <div class="password-strength-pwned text-danger small" role="alert">{{ pwnedText }}</div>
}
@if (status === 'unavailable' && pwnedUnavailableText) {
  <small class="password-strength-pwned-unavailable text-muted" role="status">{{
    pwnedUnavailableText
  }}</small>
}
