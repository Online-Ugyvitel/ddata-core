<div [class]="wrapperClass">
  <!-- label -->
  @if (showLabel) {
    <label [class]="labelClass" [for]="id">
      {{ labelText }}:
      @if (isRequired) {
        <span aria-hidden="true"> *</span>
      }
    </label>
  }

  <!-- combobox container -->
  <div [class]="inputBlockClass" [ngClass]="showLabel ? inputBlockExtraClass : ''">
    <!-- prepend -->
    @if (!!prepend) {
      <div class="input-group-prepend">
        <div class="input-group-text">{{ prepend }}</div>
      </div>
    }

    <!-- combobox input -->
    <div class="autocomplete-combobox">
      <input
        #inputBox
        type="text"
        class="form-control"
        [id]="id"
        [value]="inputValue"
        [class.invalid]="model.validationErrors.includes(field)"
        [class.disable-appearance]="disabledAppearance"
        [disabled]="disabled"
        [placeholder]="unselectedText"
        role="combobox"
        [attr.aria-expanded]="isOpen"
        [attr.aria-controls]="listboxId"
        [attr.aria-activedescendant]="getActiveDescendant()"
        aria-autocomplete="list"
        [attr.aria-required]="isRequired"
        (focus)="onInputFocus()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
      />

      <!-- dropdown listbox -->
      @if (isOpen) {
        <div
          class="autocomplete-dropdown"
          [id]="listboxId"
          role="listbox"
          [attr.aria-label]="labelText + ' options'"
        >
          @if (filteredItems.length === 0) {
            <div class="autocomplete-option no-results" role="option">Nincs találat</div>
          }

          @for (item of filteredItems; track item[valueField]; let i = $index) {
            <div
              class="autocomplete-option"
              [class.selected]="selectedIndex === i"
              [id]="getOptionId(i)"
              role="option"
              [attr.aria-selected]="selectedIndex === i"
              (click)="selectItem(item, i)"
              (mouseenter)="selectedIndex = i"
            >
              {{ item[text] }}
            </div>
          }
        </div>
      }
    </div>

    <!-- append -->
    @if (!!append) {
      <div class="input-group-append">
        <div class="input-group-text">{{ append }}</div>
      </div>
    }
  </div>
</div>
