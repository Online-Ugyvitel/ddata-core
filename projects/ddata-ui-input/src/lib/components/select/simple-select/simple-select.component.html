@if (model) {
  <div [class]="wrapperClass">
    <!-- label -->
    @if (showLabel) {
      <label [class]="labelClass" [for]="id">
        {{ labelText }}:
        @if (isRequired) {
          <span aria-hidden="true"> *</span>
        }
      </label>
    }

    <!-- select -->
    <div [class]="inputBlockClass" [ngClass]="showLabel ? inputBlockExtraClass : ''">
      <!-- prepend -->
      @if (!!prepend) {
        <div class="input-group-prepend">
          <div class="input-group-text">{{ prepend }}</div>
        </div>
      }

      <select
        class="form-select"
        [id]="id"
        [(ngModel)]="model[field]"
        [class.invalid]="model.validationErrors?.includes(field)"
        [class.disable-appearance]="disabledAppearance"
        [disabled]="disabled"
        [attr.aria-required]="isRequired"
        (change)="selectItem()"
      >
        @if (addEmptyOption) {
          <option data-default value="0">-- {{ unselectedText }} --</option>
        }

        @for (item of items; track item[valueField]) {
          <option [value]="item[valueField]" [selected]="item[valueField] === model[field]">
            {{ item[text] }}
          </option>
        }
      </select>

      <!-- append -->
      @if (!!append) {
        <div class="input-group-append">
          <div class="input-group-text">{{ append }}</div>
        </div>
      }
    </div>
  </div>
}
